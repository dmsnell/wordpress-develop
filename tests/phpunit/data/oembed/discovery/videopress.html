<body>
<div id="video" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%;"></div>
<script>
	if ( ! window.globalVideoPressArgs ) {
		window.globalVideoPressArgs = {};
	}
	window.globalVideoPressArgs.isPrivate = false;
	window.globalVideoPressArgs.translationData = window.globalVideoPressArgs.translationData || null;
	window.globalVideoPressArgs.isRestrictedVideoSite = false;
	window.globalVideoPressArgs.isActiveVideoTrialSite = false;
	window.globalVideoPressArgs.defaultSkin = "v2";
</script>
<script src="https://v0.wordpress.com/js/videojs/videopress-routes.min.js?m=1792683091"></script>
<script>
	(function () {
		window.addEventListener( 'message', function ( event ) {
			var allowed_origins = [ 'https://videopress.com', 'https://video.wordpress.com' ];
			if ( -1 === allowed_origins.indexOf( event.origin ) ) {
				return;
			}

			if ( event.data.event !== 'videopress_token_request' ) {
				return;
			}

			var guid = event.data.guid;
			var token = window.globalVideoPressArgs.authToken;
			var isPrivate = window.globalVideoPressArgs.isPrivate;

			if ( isPrivate && ! token ) {
				event.source.postMessage(
					{
						event: 'videopress_token_error',
						guid: guid,
						privacyDetails: window.globalVideoPressArgs.privacyDetails,
					},
					event.origin
				);
				return;
			}

			event.source.postMessage(
				{
					event: 'videopress_token_received',
					guid: guid,
					jwt: token,
				},
				event.origin
			);

		} );
	})();
</script>
